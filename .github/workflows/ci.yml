name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug (gcc)
            cc: gcc
            args: ""
          # clang as well as gcc, and not for the sanitizers alone: the two disagree about
          # whether a conversion between two enum types, an incompatible function pointer and an
          # implicit declaration are warnings or errors. A consumer building this with clang
          # should not be the one to find out.
          - name: debug (clang)
            cc: clang
            args: ""
          - name: asan+ubsan (clang)
            cc: clang
            args: "-DINKCELL_ENABLE_ASAN=ON -DINKCELL_ENABLE_UBSAN=ON"
          # The claim that SDL2 is optional is worth nothing if nobody builds without it. This
          # is the job that would have caught an #include or a symbol that quietly became
          # compulsory - the same reason inkwell has a job that builds with no Mbed TLS.
          - name: no SDL (gcc)
            cc: gcc
            args: "-DINKCELL_WITH_SDL=OFF"
    steps:
      # inkwell is a submodule and inkcell does not build without it; the default checkout
      # leaves a gitlink and an empty directory, which fails at the add_subdirectory().
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # libclang-rt-18-dev is the one that is easy to miss: Ubuntu's clang package does not pull
      # the sanitizer runtimes in, and without them the link fails looking for
      # libclang_rt.asan-x86_64.a rather than at anything to do with this code. libsdl2-dev is
      # what decides whether the window backend is built at all, and its suite runs against
      # SDL's "dummy" video driver - so it needs the library and not a display.
      - name: Install build tools
        run: >
          sudo apt-get update &&
          sudo apt-get install -y ninja-build clang libclang-rt-18-dev libsdl2-dev

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug ${{ matrix.args }}

      - name: Build
        run: cmake --build build

      # The unit suite, the no-prose check, and the golden sheet. The last of those renders
      # every component in every theme through the capture backend, which means the widget code
      # - five thousand lines with no other test - runs under the sanitizers on the clang job.
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

      # A digest says *that* a page changed; only the picture says *what*. Rendered and kept
      # solely on failure, because the whole point of committing digests instead of images is
      # that a green run costs the repository nothing.
      - name: Render the pages that differ
        if: failure()
        run: |
          mkdir -p build/gallery
          ./build/examples/gallery/inkcell_gallery --out build/gallery > /dev/null
          python3 scripts/frames.py build/gallery --sheet build/gallery/contact.png

      - name: Upload them
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-${{ matrix.cc }}
          path: build/gallery/*.png
          if-no-files-found: ignore

  # macOS is a development host, not a target: the fb backend and evdev compile to refusals there
  # and the window is how the UI is seen. The golden sheet is the same sheet, so this job is also
  # what says the rasteriser draws the same pixels under a second libc and a second compiler.
  macos:
    name: debug (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # A venv for the Mbed TLS generator under inkwell, because Homebrew's Python refuses a
      # --user install (PEP 668), and passed by path because CMake otherwise finds that one first.
      - name: Install build tools
        run: |
          brew install ninja sdl2
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install jinja2 jsonschema

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DPython3_EXECUTABLE="$RUNNER_TEMP/venv/bin/python3"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      # The generated glyph tables are excluded for the reason they are in their own directory:
      # 42k lines nobody wrote and nobody reads, and reformatting them would bury every real
      # change in a diff the size of the repository.
      - name: Check formatting
        run: |
          files=$(git ls-files '*.c' '*.h' | grep -v '^src/generated/')
          clang-format-18 --dry-run --Werror $files
