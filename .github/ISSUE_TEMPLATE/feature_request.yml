name: Feature request
description: Suggest something new for inkcell (the UI toolkit), or a change to how something works.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. inkcell ships only what a widget needs to put on a panel - describe the component or behaviour, not your application's screen.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem, and why it cannot be done well with what is there today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: The behaviour you want. An API sketch is welcome but not required.
      render: c
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Rasteriser / fb_draw
        - Widgets
        - Theme, fonts, icons
        - Input / evdev / button profiles
        - i18n catalog
        - Build / CMake
        - Not sure
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Workarounds you use now, or how you would build it in your own code.
  - type: textarea
    id: context
    attributes:
      label: Anything else?
